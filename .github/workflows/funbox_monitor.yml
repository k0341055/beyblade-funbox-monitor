name: Funbox 商品 Monitor

on:
  workflow_dispatch:
    inputs:
      check_rounds:
        description: '執行輪數（留空使用預設值 60，約 5 分鐘）'
        required: false
        default: ''
      checkout_mode:
        description: '購買模式：sequential（帳號平行、商品逐件，預設）或 parallel（帳號×商品全平行）'
        required: false
        default: ''
      parallel_checkout_limit:
        description: '平行結帳最大同時任務數'
        required: false
        default: '6'
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-funbox-${{ runner.os }}

      - name: Install Python dependencies
        run: pip install -r funbox_monitor/requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('funbox_monitor/requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Restore seen products state
        uses: actions/cache@v4
        with:
          path: funbox_monitor/seen_products.json
          key: funbox-seen-${{ github.run_id }}
          restore-keys: |
            funbox-seen-

      - name: Test Funbox connection
        env:
          SEARCH_URL: ${{ vars.FUNBOX_SEARCH_URL }}
        run: |
          echo "=== DNS ==="
          nslookup shop.funbox.com.tw || true
          echo "=== HTTPS ==="
          curl -sv --connect-timeout 5 --max-time 15 \
            "${SEARCH_URL}/products.json" \
            -o /dev/null 2>&1 | grep -E "Connected|HTTP|< HTTP|curl:" || true

      - name: Run Funbox monitor
        env:
          GMAIL_SENDER:      ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:    ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_RECIPIENTS:  ${{ secrets.GMAIL_RECIPIENTS }}
          FUNBOX_EMAIL:      ${{ secrets.FUNBOX_EMAIL }}
          FUNBOX_PASSWORD:   ${{ secrets.FUNBOX_PASSWORD }}
          FUNBOX_EMAIL_2:    ${{ secrets.FUNBOX_EMAIL_2 }}
          FUNBOX_PASSWORD_2: ${{ secrets.FUNBOX_PASSWORD_2 }}
          FUNBOX_EMAIL_3:    ${{ secrets.FUNBOX_EMAIL_3 }}
          FUNBOX_PASSWORD_3: ${{ secrets.FUNBOX_PASSWORD_3 }}
          SEARCH_URL:              ${{ vars.FUNBOX_SEARCH_URL }}
          CHECK_ROUNDS:            ${{ inputs.check_rounds || '60' }}
          CHECKOUT_MODE:           ${{ inputs.checkout_mode || 'parallel' }}
          PARALLEL_CHECKOUT_LIMIT: ${{ inputs.parallel_checkout_limit || '6' }}
          STATE_FILE:              'seen_products.json'
        working-directory: funbox_monitor
        run: python funbox_monitor.py
