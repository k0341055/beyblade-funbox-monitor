name: 1999 Monitor

on:
  workflow_dispatch:   # 由 cron-job.org 透過 GitHub API 觸發

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 62

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-beyblade-${{ runner.os }}

      - name: Install Python dependencies
        run: pip install -r beyblade_monitor/requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('beyblade_monitor/requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      # ── 跨 workflow 執行之狀態：seen_products.json ────────────────────────
      # restore-keys 確保永遠能讀到最新的已見商品清單
      - name: Restore seen products state
        uses: actions/cache@v4
        with:
          path: beyblade_monitor/seen_products.json
          key: beyblade-seen-${{ github.run_id }}
          restore-keys: |
            beyblade-seen-

      - name: Run Beyblade X monitor (4 rounds)
        env:
          GMAIL_SENDER:     ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:   ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}
          CHECK_ROUNDS:     '190'
          STATE_FILE:       'seen_products.json'
        working-directory: beyblade_monitor
        run: python beyblade_monitor.py

