name: 誠品 Beyblade X Monitor

on:
  workflow_dispatch:
    inputs:
      check_rounds:
        description: '執行輪數（留空使用預設值 50，約 5 分鐘）'
        required: false
        default: ''
      monitor_mode:
        description: '監控模式：exhibition（書展API）/ keyword（關鍵字搜尋）/ combined（兩者合併，預設）/ product（指定商品）'
        required: false
        default: ''

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-eslite-${{ runner.os }}

      - name: Install Python dependencies
        run: pip install -r eslite_monitor/requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('eslite_monitor/requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      # ── 下單狀態（避免重複下單） ─────────────────────────────────────
      - name: Restore order state
        uses: actions/cache@v4
        with:
          path: eslite_monitor/eslite_order_state.json
          key: eslite-order-${{ github.run_id }}
          restore-keys: |
            eslite-order-

      # ── Session 狀態（信任裝置 cookies，避免每次觸發簡訊驗證） ────────
      # 優先從 cache 讀取（較新），cache miss 時從 secret 解碼（備援）
      - name: Restore session state from cache
        uses: actions/cache@v4
        id: session-cache
        with:
          path: eslite_monitor/eslite_storage_state.json
          key: eslite-session-${{ github.run_id }}
          restore-keys: |
            eslite-session-

      - name: Restore session state from secret (fallback)
        if: steps.session-cache.outputs.cache-hit != 'true'
        env:
          ESLITE_STORAGE_STATE_B64: ${{ secrets.ESLITE_STORAGE_STATE_B64 }}
        run: |
          if [ -n "$ESLITE_STORAGE_STATE_B64" ]; then
            echo "$ESLITE_STORAGE_STATE_B64" | base64 -d > eslite_monitor/eslite_storage_state.json
            echo "已從 secret 還原 session 狀態"
          fi

      - name: Run Eslite monitor
        env:
          GMAIL_SENDER:         ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:       ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_RECIPIENTS:     ${{ secrets.GMAIL_RECIPIENTS }}
          ESLITE_ACCOUNT:       ${{ secrets.ESLITE_ACCOUNT }}
          ESLITE_PASSWORD:      ${{ secrets.ESLITE_PASSWORD }}
          ORDER_RECIPIENT:      ${{ secrets.ORDER_RECIPIENT }}
          CHECKOUT_CITY:        ${{ secrets.CHECKOUT_CITY }}
          CHECKOUT_STORE_CODE:  ${{ secrets.CHECKOUT_STORE_CODE }}
          ESLITE_API_URL:          ${{ vars.ESLITE_API_URL }}
          ESLITE_EVENT_URL:        ${{ vars.ESLITE_EVENT_URL }}
          ESLITE_SEARCH_URL:       ${{ vars.ESLITE_SEARCH_URL }}
          ESLITE_PURCHASED_NAMES:  ${{ secrets.ESLITE_PURCHASED_NAMES }}
          MONITOR_KEYWORDS:        ${{ vars.MONITOR_KEYWORDS }}
          AUTO_CHECKOUT:           'true'
          HEADLESS:             'true'
          MONITOR_MODE:         ${{ inputs.monitor_mode || 'combined' }}
          CHECK_ROUNDS:         ${{ inputs.check_rounds || '50' }}
          CHECKOUT_MAX:         '3'
          ORDER_STATE_FILE:     'eslite_order_state.json'
          STORAGE_STATE_FILE:   'eslite_storage_state.json'
        working-directory: eslite_monitor
        run: python eslite_monitor.py
