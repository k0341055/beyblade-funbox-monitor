name: 1999 Monitor

on:
  workflow_dispatch:
    inputs:
      check_rounds:
        description: '執行輪數（留空使用預設值 190）'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-1999-${{ runner.os }}

      - name: Install Python dependencies
        run: pip install -r 1999_monitor/requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('1999_monitor/requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      # ── 跨 workflow 執行之狀態：seen_products.json ────────────────────────
      # restore-keys 確保永遠能讀到最新的已見商品清單
      - name: Restore seen products state
        uses: actions/cache@v4
        with:
          path: 1999_monitor/seen_products.json
          key: 1999-seen-${{ github.run_id }}
          restore-keys: |
            1999-seen-

      - name: Run 1999 monitor
        env:
          GMAIL_SENDER:      ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:    ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_RECIPIENTS:  ${{ secrets.GMAIL_RECIPIENTS }}
          CHECK_ROUNDS:      ${{ inputs.check_rounds || '195' }}
          STATE_FILE:        'seen_products.json'
        working-directory: 1999_monitor
        run: python 1999_monitor.py
